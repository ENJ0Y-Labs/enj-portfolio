<!DOCTYPE html>
<html>
    <head>
        <title>5. Media in HTML</title>
    </head>
    <body>
        <!--
        img - image
        src - source
        alt - alternative text
        -->
        <img src="Media/Image/img.jpg" alt="Image" width="100%" >
        <!--<video src="Media/Video/vid.mp4" controls autoplay muted width="100%"></video>-->
        <video src="Media/Video/vid.mp4" controls poster="Media/Image/img.jpg" width="100%"></video>
        <audio src="Media/Audio/aud.mp3" controls></audio>
    </body>
</html>
