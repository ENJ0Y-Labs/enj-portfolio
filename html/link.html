<!DOCTYPE html>
<html>
    <head>
        <title>4. Links in HTML</title>
    </head>
    <body>
        <!-- 
        In HTML we have 2 types of links
        1. relative links
            These are links that are found in our local storage.
            Therefore, you dont need internet connection to access them.
        2. absolute links
            These are links that  are not found in our local storage,
            Therfore, we need internet connection to access them.
        -->

        <!-- 
        a - anchor tag 
        href - hyper reference
         -->
        <a href=".\index.html" target="_blank">Index</a>
        <a href=".\index2.html" target="_blank">Index2</a>
        <a href=".\list.html" target="_blank">List</a>

        <a href="http://www.youtube.com" target="_blank">Youtube</a><br>
      
        <!-- 
        Attributes
            it is a keyword that gives meaning or extra information to an element.

            They are always found im the opening tag of the element.
            
            We can have more than one attriibute in an element.

            they are not visible in the browser.

        Assignment
            1. Three absolute link from three appopraint site
            2. Do a research on tags vs elements vs markup
        -->
        <a href="http://www.facebook.com" target="_blank">Facebook</a>
        <a href="http://www.duolingo.com" target="_blank">Duolingo</a>
        <a href="http://www.github.com" target="_blank">Github</a>

    </body>
</html>
