<!DOCTYPE html>
<html>
    <head>
        <title>8. Continuation of Table in HTML</title>
    </head>
    <body>
        <table border="">
            <tr>
                <th colspan="5">NIIT'S TIME TABLE</th>
            </tr>
            <tr>
                <th>TIME</th>
                <th>8AM - 10AM</th>
                <th>10AM-12PM</th>
                <th>12PM-2PM</th>
                <th>2PM-4PM</th>
            </tr>
            <tr>
                <th>MONDAY</th>
                <td>MS Office</td>
                <td>Logic building</td>
                <th rowspan="5">BREAK</th>
                <td>Hibernate</td>
            </tr>
            <tr>
                <th>TUESDAY</th>
                <td>Logic building</td>
                <td>JAVA</td>
                <td>JSF</td>
            </tr>
            <tr>
                <th>WEDNESDAY</th>
                <td>Hibernate</td>
                <td>Networking</td>
                <td>CSS</td>
            </tr>
            <tr>
                <th>THURSDAY</th>
                <td>JSP</td>
                <td>GUI</td>
                <td>SQL</td>
            </tr>
            <tr>
                <th>FRIDAY</th>
                <td colspan="2">Spring Boot</td>
                <td>JSF</td>
            </tr>
        </table>
        <!--
        tr - table row
        th - table heading
        td - table data
        -->
    </body>
</html>
