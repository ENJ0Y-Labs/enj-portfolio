<!DOCTYPE html>
<html>
    <head>
        <title>7. Table in HTML</title>
    </head>
    <body>
        <table border="">
            <tr>
                <td>One</td>
                <td>Two</td>
                <td>Three</td>
            </tr>
            <tr>
                <td>Four</td>
                <td>Five</td>
                <td>Six</td>
            </tr>
            <tr>
                <td>Seven</td>
                <td>Eight</td>
                <td>Nine</td>
            </tr>
            <tr>
                <td>Ten</td>
                <td>Eleven</td>
                <td>Twelve</td>
            </tr>
        </table>
        <!--
        tr - table row
        th - table heading
        td - table data
        -->
    </body>
</html>
